name: amana_send
description: amana_send.
publish_to: "none"
version: 1.3.124+164


environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  path: ^1.8.2
  path_drawing: ^1.0.1

  # API
  graphql: ^5.1.3
  http: ^1.1.0

  # Firebase
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Web
  flutter_inappwebview: ^6.1.5

  # State management
  provider: ^6.0.5
  path_provider: ^2.1.1
  go_router: ^13.0.1
  package_info_plus: ^4.0.0

  # local storage
  camera: ^0.10.5+9
  shared_preferences: ^2.2.0
  cached_network_image: ^3.2.3
  image_picker: ^0.8.6
  share_plus: ^7.0.0
  permission_handler: ^11.0.1

  flutter_svg: ^2.0.9
  lottie: ^3.1.3
  pinput: ^3.0.1
  photo_view: ^0.14.0
  rxdart: ^0.27.5
  universal_io: ^2.0.4
  url_launcher: ^6.1.5

  # App style
  animated_text_kit: ^4.2.2
  heroicons: ^0.9.0
  flag: ^7.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_html: ^3.0.0-beta.2
  image: ^4.3.0
  line_icons: ^2.0.1
  tutorial_coach_mark: ^1.2.11

  # Message helper
  fluttertoast: ^8.2.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.5
  archive: ^3.6.1
  win32: ^5.8.0
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/json/
    - assets/svg/
    - assets/icons/

  fonts:
    - family: work_sans
      fonts:
        - asset: assets/fonts/work_sans/bold.ttf
          weight: 700
        - asset: assets/fonts/work_sans/medium.ttf
          weight: 500
        - asset: assets/fonts/work_sans/regular.ttf
          weight: 400
        - asset: assets/fonts/work_sans/light.ttf
          weight: 300

    - family: almarai
      fonts:
        - asset: assets/fonts/almarai/bold.ttf
          weight: 700
        - asset: assets/fonts/almarai/regular.ttf
          weight: 500
        - asset: assets/fonts/almarai/regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/light.ttf
          weight: 300

    - family: halter
      fonts:
        - asset: assets/fonts/halter/regular.ttf
