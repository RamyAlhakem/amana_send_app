name: Production Google Play

on:
  push:
    branches: "release/production"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    env:
      JAVA_VERSION: 21
      FLUTTER_VERSION: 3.27.1
      AAB_PATH: build/app/outputs/bundle/productionRelease/app-production-release.aab
      KEYSTORE_PATH: android/upload-keystore.jks
      KEY_PROPS_PATH: android/key.properties
      SERVICE_ACCOUNT_PATH: store_credentials.json

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: "release/production"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > ${{ env.KEYSTORE_PATH }}

      - name: Decode Android key properties
        run: echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" | base64 --decode > ${{ env.KEY_PROPS_PATH }}

      - name: Decode Android Service Account
        run: echo "${{ secrets.GOOGLE_PLAY_CREDENTIAL_FILE }}" | base64 --decode > ${{ env.SERVICE_ACCOUNT_PATH }}

      - name: Install dependencies
        run: flutter pub get

      # - name: Analyze to check for bad Dart/Flutter practices
      #   run: flutter analyze

      - name: Build App
        run: flutter build appbundle --flavor production -t lib/main_production.dart --release

      - name: Upload generated aab to the artifacts
        uses: actions/upload-artifact@master
        with:
          name: aab-stores
          path: ${{ env.AAB_PATH }}

      - name: Deploy to Play Store (Internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.SERVICE_ACCOUNT_PATH }}
          packageName: com.amana_send
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal

      - name: Extract App Version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Send ClickUp Notification
        uses: ./.github/actions/clickup-notify
        with:
          clickup_api_token: ${{ secrets.CLICKUP_API_TOKEN }}
          clickup_workspace_id: ${{ secrets.CLICKUP_WORKSPACE_ID }}
          clickup_channel_id: ${{ secrets.CLICKUP_CHANNEL_ID }}
          clickup_project_name: "${{ secrets.CLICKUP_PROJECT_NAME_GOOGLE_PLAY }} - _v${{ env.APP_VERSION }}_"
