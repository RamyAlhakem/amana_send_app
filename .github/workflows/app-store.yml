name: 🚀 App Store Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (production or staging)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build_and_deploy:
    runs-on: macos-latest

    permissions:
      contents: read
      actions: read

    env:
      FLUTTER_VERSION: 3.32.8
      FLAVOR: ${{ inputs.flavor || (contains(github.ref_name, 'staging') && 'staging' || 'production') }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix git dubious ownership
        run: git config --global --add safe.directory '*'

      - name: Import certs
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ secrets.IOS_APP_PACKAGE_NAME }}${{ env.FLAVOR == 'staging' && '.staging' || '' }}
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        continue-on-error: true
        id: download_profiles

      - name: Verify provisioning profile download
        if: steps.download_profiles.outcome != 'success'
        run: |
          echo "::error::Failed to download provisioning profile for bundle-id: ${{ secrets.IOS_APP_PACKAGE_NAME }}${{ env.FLAVOR == 'staging' && '.staging' || '' }}"
          echo "::error::Check that the App ID and an App Store Connect profile exist in App Store Connect for this bundle ID."
          echo "::error::Also verify APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID and APPSTORE_API_PRIVATE_KEY are correct and the API key has the 'App Manager' role."
          exit 1

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: pod install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Update Firebase/CoreOnly pod
        run: |
          cd ios
          pod update Firebase/CoreOnly
          cd ..

      - name: Update Provisioning Profile
        run: |
          PROFILE_NAME="${{ secrets.APPSTORE_PROVISIONING_PROFILE_NAME }}${{ env.FLAVOR == 'staging' && ' staging' || '' }}"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"deploy all\";/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${{ secrets.APPSTORE_TEAM_ID }};/g" ios/Runner.xcodeproj/project.pbxproj

      # - name: Analyze to check for bad Dart/Flutter practices
      #   run: flutter analyze

      - name: Generate ExportOptions
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPSTORE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
            <key>${{ secrets.IOS_APP_PACKAGE_NAME }}${{ env.FLAVOR == 'staging' && '.staging' || '' }}</key>
            <string>${{ secrets.APPSTORE_PROVISIONING_PROFILE_NAME }}${{ env.FLAVOR == 'staging' && ' staging' || '' }}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build App
        run: |
          flutter build ipa \
          --release \
          --export-options-plist=ios/ExportOptions.plist \
          --flavor ${{ env.FLAVOR }} \
          -t lib/main_${{ env.FLAVOR }}.dart
          echo "APP_FILE=$(basename $(ls build/ios/ipa/*.ipa))" >> $GITHUB_ENV

      - name: Upload generated ipa to the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_FILE }}
          path: build/ios/ipa/${{ env.APP_FILE }}
          retention-days: 3

      - name: Decode App Store API key
        run: |
          mkdir private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

      - name: Upload app to TestFlight
        run: |
          xcrun altool --upload-app \
          --output-format json \
          --file build/ios/ipa/${{ env.APP_FILE }} \
          --type ios \
          --apiKey ${{ secrets.APPSTORE_API_KEY_ID }} \
          --apiIssuer ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Extract App Version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Send ClickUp Notification
        uses: architweb/ClickUpNotification@v3.2.0
        with:
          clickup_api_token: ${{ secrets.CLICKUP_API_TOKEN }}
          clickup_workspace_id: ${{ secrets.CLICKUP_WORKSPACE_ID }}
          clickup_channel_id: ${{ secrets.CLICKUP_CHANNEL_ID }}
          clickup_project_name: "${{ secrets.CLICKUP_PROJECT_NAME_APP_STORE }} - _v${{ env.APP_VERSION }}_"
          filter_agent_commits: "true"
          group_commits_by_type: "true"
          show_commit_statistics: "true"
